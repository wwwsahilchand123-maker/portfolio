<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="title desc">
<title id="title">Minimal project thumbnails</title>
<desc id="desc">Seven small, friendly line illustrations for cybersecurity and software projects, using soft charcoal backgrounds and restrained crimson accents.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#191719"/><stop offset="1" stop-color="#101012"/></linearGradient>
