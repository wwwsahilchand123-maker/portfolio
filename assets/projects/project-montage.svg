<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-labelledby="title desc">
<title id="title">Project thumbnails</title>
<desc id="desc">Seven compact charcoal and crimson illustrations inspired by the portfolio projects: network detection, security automation, an AI assistant, a learning lab, packaging research, encryption, and weather.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b191b"/><stop offset="1" stop-color="#0d0d10"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff6475"/><stop offset="1" stop-color="#d20f2b"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#e50920" stop-opacity=".17"/><stop offset="1" stop-color="#e50920" stop-opacity="0"/></radialGradient>
 <style>
  .panel{fill:#141417;stroke:#393237;stroke-width:2}
  .edge{fill:none;stroke:#51484c;stroke-width:2}
  .line{fill:none;stroke:#d8d2d3;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .soft{fill:none;stroke:#888084;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .red{fill:none;stroke:url(#accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
  .hot{fill:#e50920}
  .pale{fill:#e8e2e3}
  .dim{fill:#777176}
  .gold{fill:#e7bd75}
  .green{fill:#91b28c}
 </style>
</defs>
