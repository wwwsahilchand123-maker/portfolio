 <radialGradient id="halo"><stop stop-color="#e50920" stop-opacity=".12"/><stop offset="1" stop-color="#e50920" stop-opacity="0"/></radialGradient>
 <style>
  .line{fill:none;stroke:#e8dfe0;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .red{fill:none;stroke:url(#accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  .fill{fill:#21191c;stroke:#e8dfe0;stroke-width:4;stroke-linejoin:round}
  .hot{fill:#e50920}
  .muted{fill:#777176}
 </style>
</defs>
