<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#080808" />
  <title>Page not found | Sahil Chand Rajwar</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #080808; color: #fff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at 50% 20%, #241014, #080808 58%); }
    main { width: min(100%, 640px); text-align: center; }
    .code { margin: 0; color: #e50920; font: 900 clamp(6rem, 24vw, 13rem)/.9 system-ui, sans-serif; letter-spacing: -.08em; }
    h1 { margin: 1.5rem 0 .5rem; font-size: clamp(1.5rem, 5vw, 2.5rem); }
    p { color: #aaa; }
    a { display: inline-flex; margin-top: 1.5rem; padding: .85rem 1.2rem; border: 1px solid #e50920; border-radius: 999px; color: #fff; text-decoration: none; }
    a:focus-visible { outline: 2px solid #ff263d; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Page not found</h1>
    <p>This page does not exist or has moved.</p>
    <a href="index.html">Back to the portfolio</a>
  </main>
</body>
</html>
